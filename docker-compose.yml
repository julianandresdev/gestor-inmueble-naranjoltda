services:
  postgres:
    image: postgres:alpine
    container_name: gestor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gestor_inmueble
    # Solo desarrollo: expone Postgres únicamente en loopback.
    # En producción elimina el bloque `ports` para no publicar el puerto.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gestor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestor_inmueble"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gestor_pgdata:
