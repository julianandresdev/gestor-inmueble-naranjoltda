services:
  postgres:
    image: postgres:alpine
    container_name: gestor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestor_inmueble
    ports:
      - "5432:5432"
    volumes:
      - gestor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestor_inmueble"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gestor_pgdata:
